canonical_non_descent_insertion:
  projection: "pi_q(x) = q in Z2^3"
  required_kernel: FROZEN_VALID_FULL_STATE_KERNEL
  projected_law: "P_q(x,q_prime) = sum_{z:pi_q(z)=q_prime} P(x,z)"
  exact_failure_rule: >-
    Sector q is failed if there are full states x and y in the required domain
    with the same parity q and a target q_prime for which their aggregate
    projected next-sector probabilities differ.
  local_statuses:
    - CLEAN
    - FAILED
    - UNRESOLVED
  stochastic_rule: COMPARE_CONDITIONAL_PROBABILITY_LAWS_NOT_SINGLE_OUTCOMES
  zero_departure_row_rule: UNRESOLVED_NOT_ZERO_FILLED
  scoring_effect: NONE_UNLESS_PROSPECTIVELY_ADOPTED

